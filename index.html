<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16244a">
<title>Amicale — Adhésions</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="acces.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --navy:#16244a;--navy2:#24386b;--gold:#c9a13b;--bg:#f3f4f8;--card:#fff;--ink:#1a1d29;--mut:#6b7080;--line:#e3e5ee;
  --ok:#1f8a5b;--okbg:#e4f5ec;--warn:#b5651d;--warnbg:#fdf0e3;--bad:#c0392b;--badbg:#fbe9e7;--r:14px;--side:240px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1220;--card:#1a1e30;--ink:#eceef5;--mut:#9aa0b4;--line:#2a2f45;--ok:#64d49d;--okbg:#14372a;--warn:#edb46e;--warnbg:#3a2a17;--bad:#f28b80;--badbg:#3d1d1a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px}
header .t1{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#cbd2e5}
header .t2{font-size:20px;font-weight:750;display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
header .t2 .note-sym{color:var(--gold)}
header .saison{margin-left:auto;font-size:12px;background:var(--gold);color:var(--navy);padding:3px 10px;border-radius:20px;font-weight:700}
main{padding:14px 14px calc(env(safe-area-inset-bottom) + 92px);max-width:780px;margin:0 auto}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav#tabs a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:11px;padding:4px 0;min-height:44px}
nav#tabs a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
nav#tabs a.on{color:var(--navy2);font-weight:650}
@media (prefers-color-scheme:dark){nav#tabs a.on{color:var(--gold)}}
.intro{margin:6px 2px 16px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700}
h2{font-size:27px;font-weight:750;letter-spacing:-.6px;line-height:1.15;margin:4px 0 4px}
.sub{color:var(--mut);margin:0;font-size:14px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 4px 8px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(22,36,74,.05);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);border-top:3px solid var(--gold)}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mut)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{color:var(--mut);font-size:13px}
.row .right{text-align:right;font-size:14px;white-space:nowrap}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--navy2);font-size:13px;font-weight:700}
@media (prefers-color-scheme:dark){.av{color:var(--gold)}}
.chip{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--ink);margin:1px 0 1px 4px}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.sumup{background:#e6f0ff;color:#2457c5}.chip.helloasso{background:#ece8ff;color:#5b3fd1}.chip.especes{background:var(--okbg);color:var(--ok)}
.chip.prelevement{background:#fff4d6;color:#8a6500}.chip.pot{background:var(--line);color:var(--mut)}
@media (prefers-color-scheme:dark){.chip.sumup{color:#9abaff;background:#1b2e50}.chip.helloasso{color:#c4b4ff;background:#302651}.chip.prelevement{color:#e6c56d;background:#3a2e14}}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;min-height:44px;font:inherit;font-weight:650;background:var(--navy2);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.full{width:100%}.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.gold{background:var(--gold);color:var(--navy)}.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:7px 11px;min-height:36px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btns .btn{flex:1}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px;min-height:46px}
textarea{min-height:120px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--navy2)}
label.f,div.f{display:block;margin:10px 0}
label.f>span,div.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
label.f>span i{font-style:normal;color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 30%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 6px;min-height:44px;font:inherit;font-size:14px}
.seg button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.search{margin-bottom:10px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.filters button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px;font:inherit;font-size:14px}
.filters button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 80px);z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--gold);color:var(--navy);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--mut);padding:26px 10px;line-height:1.7}
.note{font-size:13px;color:var(--mut);margin:6px 2px}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner.ok{background:var(--okbg);color:var(--ok)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,30,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet .panel{background:var(--bg);width:100%;max-width:780px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 14px calc(env(safe-area-inset-bottom) + 20px)}
.sheet .bar{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 0 10px;z-index:2}
.sheet .bar b{flex:1;font-size:19px;font-weight:750}
.x{border:0;background:var(--line);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mut);cursor:pointer;font-size:14px}
.drop.over{border-color:var(--gold);background:var(--warnbg)}
.recu{background:#fff;color:#111;border-radius:12px;padding:18px;font-size:14px;border:1px solid #ddd}
.recu h4{margin:0 0 4px;font-size:16px}
.recu .n{float:right;font-weight:700}
.recu .amt{font-size:22px;font-weight:700;margin:10px 0}
.recu small{color:#666}
.ventil{border-top:1px solid var(--line);margin-top:8px}
.ventil div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.recu .ventil,.recu .ventil div{border-color:#e5e5e5}
table.prev{width:100%;border-collapse:collapse;font-size:13px}
table.prev td,table.prev th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.prev select{font-size:13px;padding:6px;min-height:36px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--navy);color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.back{display:inline-block;margin:0 0 6px;color:var(--navy2);text-decoration:none;font-weight:650}
@media (prefers-color-scheme:dark){.back,a.lnk{color:var(--gold)}}
.mails{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}.mails:empty{display:none}
.mchip{display:inline-flex;align-items:center;gap:4px;background:var(--line);border-radius:16px;padding:3px 4px 3px 10px;font-size:14px;max-width:100%;overflow-wrap:anywhere}
.mchip button{border:0;background:transparent;color:var(--bad);font-size:18px;line-height:1;padding:0 6px;cursor:pointer}
.mchip.add{background:var(--okbg);color:var(--ok);padding-right:10px}.mchip.del{background:var(--badbg);color:var(--bad);text-decoration:line-through;padding-right:10px;cursor:pointer}.mchip.del.keep{text-decoration:none;background:var(--line);color:var(--ink)}
.mailadd{display:flex;gap:8px;align-items:center}.mailadd input{flex:1}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.login{max-width:380px;margin:40px auto}
.row.annule .main b{text-decoration:line-through;opacity:.6}
.big{font-size:18px;padding:18px}

/* ---- Grand écran : menu latéral ---- */
@media (min-width:900px){
  header{position:fixed;left:0;top:0;width:var(--side);height:120px;padding:26px 20px 0;background:var(--navy);z-index:8}
  header .t2{flex-wrap:wrap;font-size:24px}
  header .saison{margin:6px 0 0}
  nav#tabs{top:120px;bottom:0;right:auto;width:var(--side);flex-direction:column;justify-content:flex-start;background:var(--navy);border:0;padding:18px 14px;gap:4px}
  nav#tabs a{flex:none;display:flex;align-items:center;gap:12px;font-size:15px;color:#c9cfe0;padding:11px 14px;border-radius:10px;text-align:left;min-height:0}
  nav#tabs a svg{margin:0;width:20px;height:20px}
  nav#tabs a.on,nav#tabs a:hover{background:var(--navy2);color:#fff}
  nav#tabs a.on{box-shadow:inset 3px 0 var(--gold);font-weight:650}
  main{margin-left:var(--side);max-width:1060px;padding:36px 48px 60px}
  h2{font-size:36px}
  .grid{grid-template-columns:repeat(4,1fr);gap:14px}
  .stat{padding:18px}
  .stat b{font-size:32px}
  .fab{bottom:32px;right:36px}
  #toast{bottom:32px;left:calc(50% + var(--side)/2)}
  .sheet{align-items:center}
  .sheet .panel{max-width:640px;max-height:90vh;border-radius:18px;padding:0 22px 22px}
  .cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
}
</style>
</head>
<body>
<header>
  <div class="t1">Amicale de la Musique des Gardiens de la Paix</div>
  <div class="t2"><span class="note-sym">♩</span><span>Adhésions</span><span class="saison" id="hsaison"></span></div>
</header>
<nav id="tabs"></nav>
<main id="view"><div class="empty">Chargement…</div></main>
<div id="sheet" class="sheet hidden"><div class="panel" id="panel"></div></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ---------- Constantes ---------- */
const MODES={especes:"Espèces",sumup:"SumUp",helloasso:"HelloAsso",cheque:"Chèque",virement:"Virement",prelevement:"Prélèvement"};
const CATS=["BF","Hie","Retraité","Sympathisant"];
const PREMIERE_SAISON=2026;
function defaultSaison(){return String(new Date().getFullYear());}
const DEF_CFG={
  asso:"Amicale de la Musique des Gardiens de la Paix",sigle:"AMGP",adresse:"",montant:10,
  tresorier:"",emailContact:"",ics:"",ibanAsso:"",bicAsso:"",prochainPrelevement:"",
  libSurplus:"Surplus / dons",fraisSumup:1.75,
  comptes:{cotis:"756000",surplus:"754100",frais:"627000",especes:"530000",cheque:"511200",virement:"512000",prelevement:"512000",sumup:"511300",helloasso:"511400"},
  msgRelance:"Bonjour {prenom},\n\nSauf erreur de notre part, votre cotisation {saison} à l'{asso} ({montant}) n'a pas encore été réglée.\n\nVous pouvez la régler en espèces lors d'une répétition, par carte (SumUp) ou en ligne via HelloAsso.\n\nMerci et à bientôt,\nLe bureau",
  msgPrenotif:"Bonjour {prenom},\n\nNous vous informons que votre cotisation {saison} d'un montant de {montant} sera prélevée le {date} sur votre compte bancaire (mandat SEPA n° {rum}).\n\nAucune démarche n'est nécessaire de votre part.\n\nCordialement,\nLe bureau de l'{asso}"
};
const ICONS={
  accueil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  adherents:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><circle cx="18" cy="9" r="3"/><path d="M17 15c3 0 5 2 5 5"/></svg>',
  paiements:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
  evenements:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>'
};

/* ---------- Etat ---------- */
const S={sb:null,session:null,profil:null,profils:[],mandats:[],paiementsAll:[],isAdmin:false,uid:null,myName:"",ready:false,
  config:null,membres:[],paiements:[],evenements:[],inscriptions:[],loaded:{},offline:false,
  q:"",mf:"membres",mc:"",pSaison:null,pMode:"",view:null,readOnly:false};

/* ---------- Utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(typeof v==="number")return v;const n=parseFloat(String(v??"").replace(/[^\d,.\-]/g,"").replace(",","."));return isNaN(n)?0:n;};
const r2=n=>Math.round((Number(n)||0)*100)/100;
const eur=n=>(Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const eurTxt=n=>(Number(n)||0).toFixed(2).replace(".",",")+" €";
const today=()=>{const t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10);};
const fd=d=>{if(!d)return"";const[y,m,j]=String(d).split("-");return j?`${j}/${m}/${y}`:d;};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g,"");
const noAcc=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
const norm=s=>noAcc(s).toLowerCase().replace(/[^a-z0-9]/g,"");
const mails=s=>[...new Set(String(s||"").toLowerCase().split(/[;,\s]+/).map(x=>x.trim()).filter(Boolean))];
const mailOk=e=>/^[^@\s,;]+@[^@\s,;]+\.[^@\s,;]+$/.test(e);
function cfg(){const c={...(S.config||{})};if(!c.saison)delete c.saison;const out={...DEF_CFG,saison:defaultSaison(),...c,comptes:{...DEF_CFG.comptes,...(c.comptes||{})}};return out;}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),3400);}
function fullName(m){return m?`${m.prenom||""} ${(m.nom||"").toUpperCase()}`.trim():"(adhérent supprimé)";}
function initials(m){return ((m.prenom||"?")[0]+(m.nom||"?")[0]).toUpperCase();}
function membre(id){return S.membres.find(m=>m.id===id);}
function membresTri(){return [...S.membres].sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr")||(a.prenom||"").localeCompare(b.prenom||"","fr"));}
function paysSaison(mid,s){return S.paiements.filter(p=>p.membreId===mid&&String(p.saison)===String(s||cfg().saison));}
function aJour(m){return paysSaison(m.id).length>0;}
function isPot(m){return m.potentiel===true&&!aJour(m);}
function isMembre(m){return m.actif!==false&&!isPot(m);}
function prelevActif(m){return !!(m.prelevement&&m.prelevement.actif);}
function montantDu(m){return num(m&&m.montantPerso)||num(cfg().montant);}
function ventil(p){const t=r2(num(p.montant));let c=p.cotis!=null&&p.cotis!==""?r2(num(p.cotis)):Math.min(t,num(cfg().montant));c=Math.min(c,t);return{total:t,cotis:c,surplus:r2(t-c)};}
function fraisDe(p){return p.mode==="sumup"?r2(num(p.montant)*num(cfg().fraisSumup)/100):0;}
function fill(tpl,v){return tpl.replace(/\{(\w+)\}/g,(_,k)=>v[k]??"");}
function ibanClean(s){return String(s||"").replace(/\s/g,"").toUpperCase();}
function ibanFmt(s){return ibanClean(s).replace(/(.{4})/g,"$1 ").trim();}
function ibanOk(s){s=ibanClean(s);if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s))return false;const r=s.slice(4)+s.slice(0,4);let m=0;for(const ch of r){const v=/[A-Z]/.test(ch)?String(ch.charCodeAt(0)-55):ch;for(const d of v)m=(m*10+(+d))%97;}return m===1;}
function bicOk(s){return !s||/^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$/.test(String(s).toUpperCase().replace(/\s/g,""));}
function mailHref(to,subject,body,bcc){const p=[];if(subject)p.push("subject="+encodeURIComponent(subject));if(body)p.push("body="+encodeURIComponent(body));if(bcc)p.push("bcc="+encodeURIComponent(bcc));return "mailto:"+mails(to).map(x=>encodeURIComponent(x).replace(/%40/g,"@")).join(",")+(p.length?"?"+p.join("&"):"");}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast("Copié");}catch(e){toast("Copie impossible : sélectionnez le texte manuellement");}}
function seasons(){const s=new Set([String(cfg().saison),...S.paiements.map(p=>String(p.saison||"")).filter(Boolean)]);return [...s].sort().reverse();}
function intro(eb,title,sub){return `<div class="intro"><div class="eyebrow">${eb}</div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:""}</div>`;}

/* ---------- Ecritures (Supabase) ---------- */
const COLS={
  membres:["id","nom","prenom","categorie","service","instrument","email","tel","actif","potentiel","montantPerso","source","derniereRelance","cree","modifie"],
  mandats:["membreId","actif","titulaire","iban","bic","rum","dateSignature","sequence","ribPath","ribNom"],
  paiements:["id","membreId","nomAffiche","saison","montant","cotis","mode","date","ref","note","recuNum","compta","encaissePar","annule","annulePar","annuleLe","annuleMotif","signalement","signalementLe","signalementTraite","remisLe","cree"],
  evenements:["id","titre","date","heure","lieu","places","description"]
};
const NULLABLE=new Set(["montantPerso","derniereRelance","modifie","dateSignature","compta","remisLe","annuleLe","annulePar","places","cotis","signalementLe","membreId","encaissePar"]);
function clean(t,o){const r={};for(const k of COLS[t]){if(o[k]===undefined)continue;let v=o[k];if(v===""&&NULLABLE.has(k))v=null;r[k]=v;}return r;}
function errMsg(e){if(!e)return"erreur";const m=e.message||String(e);if(/row-level security|permission|42501/i.test(m))return"vous n'avez pas les droits pour cette action";if(/check constraint/i.test(m))return"donnée refusée (saison ou date avant 2026 ?)";if(/duplicate key/i.test(m))return"cet élément existe déjà";if(/Failed to fetch|NetworkError/i.test(m))return"pas de connexion";return m;}
function canWrite(){if(!S.sb||!S.session){toast("Vous n'êtes pas connecté");return false;}return true;}
async function chk(p){const {data,error}=await p;if(error)throw error;return data;}
async function put(path,data){
  if(!canWrite())return false;
  const [col,id]=path.split("/");
  try{
    if(col==="config"){await chk(S.sb.from("config").upsert({id:1,data}));}
    else if(col==="membres"){const {prelevement,...m}=data;await chk(S.isAdmin?S.sb.from("membres").upsert(clean("membres",{...m,id})):S.sb.from("membres").insert(clean("membres",{...m,id})));
      if(prelevement&&S.isAdmin)await chk(S.sb.from("mandats").upsert(clean("mandats",{...prelevement,membreId:id})));}
    else if(COLS[col]){await chk(S.sb.from(col).upsert(clean(col,{...data,id})));}
    else throw new Error("table inconnue "+col);
    reload();return true;
  }catch(e){toast("Enregistrement impossible : "+errMsg(e));return false;}
}
async function insertPaiement(data){
  if(!canWrite())return null;
  try{const row=await chk(S.sb.from("paiements").insert(clean("paiements",data)).select().single());reload();return row;}
  catch(e){toast("Enregistrement impossible : "+errMsg(e));return null;}
}
async function upd(path,data,silent){
  if(!canWrite())return false;
  const [col,id]=path.split("/");
  try{
    if(col==="membres"){const {prelevement,...m}=data;if(Object.keys(m).length)await chk(S.sb.from("membres").update(clean("membres",m)).eq("id",id));
      if(prelevement)await chk(S.sb.from("mandats").upsert(clean("mandats",{...prelevement,membreId:id})));}
    else await chk(S.sb.from(col).update(clean(col,data)).eq("id",id));
    reload();return true;
  }catch(e){if(!silent)toast("Mise à jour impossible : "+errMsg(e));return false;}
}
async function del(path){
  if(!canWrite())return false;
  const [col,id]=path.split("/");
  try{await chk(S.sb.from(col).delete().eq("id",id));reload();return true;}catch(e){toast("Suppression impossible : "+errMsg(e));return false;}
}
async function saveFile(filename,data){
  try{const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(filename)?"text/csv;charset=utf-8":/\.json$/.test(filename)?"application/json":"application/octet-stream"});
    const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;}
  catch(e){toast("Téléchargement impossible : "+e.message);return false;}
}

function confirmBox(msg,ok="Confirmer",danger=true){
  return new Promise(res=>{
    const host=document.createElement("div");host.className="sheet";host.style.zIndex=30;host.style.alignItems="center";
    host.innerHTML=`<div class="panel" style="border-radius:18px;max-width:420px;margin:20px;padding:18px"><p style="margin:0 0 14px">${esc(msg)}</p><div class="btns"><button class="btn sec" data-r="0">Annuler</button><button class="btn ${danger?"danger":""}" data-r="1">${esc(ok)}</button></div></div>`;

const SUBVIEWS=["relances","prelevements","compta","import","reglages","sauvegarde","caisses"];
function tabsFor(){return S.isAdmin?ADMIN_TABS:CAISSE_TABS;}
function allowed(v){if(!S.session||!S.profil)return v==="login";return S.isAdmin?(ADMIN_TABS.some(t=>t[0]===v)||SUBVIEWS.includes(v)):CAISSE_TABS.some(t=>t[0]===v);}
function currentView(){if(!S.session||!S.profil)return"login";const h=location.hash.replace("#","");return allowed(h)?h:"accueil";}

function sepaTxt(s,max){return noAcc(s).replace(/[^A-Za-z0-9\/\-?:().,'+ ]/g," ").replace(/\s+/g," ").trim().slice(0,max||70);}
async function genSepa(sel,record){
  const c=cfg(),dateEch=S._dateEch||c.prochainPrelevement;
  if(!dateEch)return toast("Indiquez la date d'échéance");
  if(dateEch<=today())return toast("La date d'échéance doit être dans le futur");
  if(!window.JSZip)return toast("Module de compression non chargé : vérifiez la connexion et réessayez");
  const now=new Date(),stamp=now.toISOString().replace(/[-:T]/g,"").slice(0,14);
  const msgId=sepaTxt(`${c.sigle||"AMGP"}-${stamp}`,35);
  const groups={FRST:[],RCUR:[]};sel.forEach(m=>groups[(m.prelevement.sequence==="RCUR")?"RCUR":"FRST"].push(m));
  const ctrl=L=>L.reduce((s,m)=>s+montantDu(m),0).toFixed(2);
  const bicA=String(c.bicAsso||"").replace(/\s/g,"").toUpperCase();
  const pmt=(seq,L,i)=>`<PmtInf><PmtInfId>${msgId}-${i}</PmtInfId><PmtMtd>DD</PmtMtd><BtchBookg>true</BtchBookg><NbOfTxs>${L.length}</NbOfTxs><CtrlSum>${ctrl(L)}</CtrlSum><PmtTpInf><SvcLvl><Cd>SEPA</Cd></SvcLvl><LclInstrm><Cd>CORE</Cd></LclInstrm><SeqTp>${seq}</SeqTp></PmtTpInf><ReqdColltnDt>${dateEch}</ReqdColltnDt><Cdtr><Nm>${sepaTxt(c.asso)}</Nm></Cdtr><CdtrAcct><Id><IBAN>${ibanClean(c.ibanAsso)}</IBAN></Id></CdtrAcct><CdtrAgt><FinInstnId>${bicA?`<BIC>${bicA}</BIC>`:"<Othr><Id>NOTPROVIDED</Id></Othr>"}</FinInstnId></CdtrAgt><ChrgBr>SLEV</ChrgBr><CdtrSchmeId><Id><PrvtId><Othr><Id>${sepaTxt(c.ics,35).replace(/ /g,"")}</Id><SchmeNm><Prtry>SEPA</Prtry></SchmeNm></Othr></PrvtId></Id></CdtrSchmeId>`
    +L.map((m,j)=>{const p=m.prelevement,bic=String(p.bic||"").replace(/\s/g,"").toUpperCase();
      return`<DrctDbtTxInf><PmtId><EndToEndId>${sepaTxt(`${msgId}-${i}-${j+1}`,35)}</EndToEndId></PmtId><InstdAmt Ccy="EUR">${montantDu(m).toFixed(2)}</InstdAmt><DrctDbtTx><MndtRltdInf><MndtId>${sepaTxt(p.rum,35)}</MndtId><DtOfSgntr>${p.dateSignature}</DtOfSgntr></MndtRltdInf></DrctDbtTx><DbtrAgt><FinInstnId>${bic?`<BIC>${bic}</BIC>`:"<Othr><Id>NOTPROVIDED</Id></Othr>"}</FinInstnId></DbtrAgt><Dbtr><Nm>${sepaTxt(p.titulaire||fullName(m))}</Nm></Dbtr><DbtrAcct><Id><IBAN>${ibanClean(p.iban)}</IBAN></Id></DbtrAcct><RmtInf><Ustrd>${sepaTxt(`Cotisation ${c.saison} ${c.sigle||"AMGP"}`,140)}</Ustrd></RmtInf></DrctDbtTxInf>`;}).join("")+`</PmtInf>`;
  let i=0;const blocks=Object.entries(groups).filter(([,L])=>L.length).map(([seq,L])=>pmt(seq,L,++i)).join("");
  const xml=`<?xml version="1.0" encoding="UTF-8"?>\n<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.008.001.02" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><CstmrDrctDbtInitn><GrpHdr><MsgId>${msgId}</MsgId><CreDtTm>${now.toISOString().slice(0,19)}</CreDtTm><NbOfTxs>${sel.length}</NbOfTxs><CtrlSum>${ctrl(sel)}</CtrlSum><InitgPty><Nm>${sepaTxt(c.asso)}</Nm></InitgPty></GrpHdr>${blocks}</CstmrDrctDbtInitn></Document>`;
  const z=new JSZip();z.file(`prelevement-${dateEch}.xml`,xml);
  const blob=await z.generateAsync({type:"blob"});
  if(!await saveFile(`prelevement-${dateEch}.zip`,blob))return;
  if(record){
    for(const m of sel){
      const amt=montantDu(m);
      await put("paiements/"+uid(),{membreId:m.id,nomAffiche:fullName(m),saison:String(c.saison),montant:amt,cotis:Math.min(amt,num(c.montant)),mode:"prelevement",date:dateEch,ref:msgId,note:"Remise SEPA",compta:"",cree:new Date().toISOString()});
      if(m.prelevement.sequence!=="RCUR")await upd("membres/"+m.id,{prelevement:{...m.prelevement,sequence:"RCUR"}});
    }
    S._selP=null;toast("Fichier généré et cotisations enregistrées");
  }else toast("Fichier généré");
}

      <button class="btn gold full" id="expC">Exporter le journal (CSV)</button>
      <p class="note">Par encaissement : débit du compte de trésorerie, crédit de la cotisation (jusqu'à ${eurTxt(c.montant)}) et du compte « ${esc(c.libSurplus)} » pour le surplus. Pour SumUp, la commission estimée (${esc(String(c.fraisSumup).replace(".",","))} %) passe en frais bancaires : vérifiez-la sur vos relevés. Journal « CA » pour la caisse, « BQ » pour le reste.</p>`
      :`<div class="empty">Rien à basculer pour cette saison.</div>`;
    const b=$("#expC");if(b)b.onclick=()=>exportCompta(L);
  }
};
function csvCell(v){v=String(v??"");if(/^[=+@\-]/.test(v)&&!/^-?\d/.test(v))v="'"+v;return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
async function exportCompta(L){
  const c=cfg(),dec=n=>n?r2(n).toFixed(2).replace(".",","):"";
  const rows=[["Journal","Date","Compte","Piece","Libelle","Debit","Credit","Mode","Reference"]];
  L.forEach((p,i)=>{
    const m=membre(p.membreId),nom=m?fullName(m):p.nomAffiche||"",v=ventil(p),fr=fraisDe(p);
    const j=p.mode==="especes"?"CA":"BQ",piece=p.recuNum||`COT-${(p.date||"").replace(/-/g,"")}-${String(i+1).padStart(3,"0")}`;
    const base=[j,fd(p.date)],tail=[MODES[p.mode]||p.mode,p.ref||""];
    rows.push([...base,c.comptes[p.mode]||c.comptes.virement,piece,`Cotisation ${p.saison} ${nom}`,dec(v.total-fr),"",...tail]);
    if(fr>0)rows.push([...base,c.comptes.frais,piece,`Commission SumUp ${nom}`,dec(fr),"",...tail]);
    rows.push([...base,c.comptes.cotis,piece,`Cotisation ${p.saison} ${nom}`,"",dec(v.cotis),...tail]);
    if(v.surplus>0)rows.push([...base,c.comptes.surplus,piece,`${c.libSurplus} ${nom}`,"",dec(v.surplus),...tail]);
  });
  const csv="﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n");
  if(!await saveFile(`compta-cotisations-${S._cs}-${today()}.csv`,csv))return;
  const todo=L.filter(p=>!p.compta);
  if(todo.length&&await confirmBox(`Marquer ces ${todo.length} encaissement${todo.length>1?"s":""} comme basculés en compta ? Ils ne pourront plus être supprimés et n'apparaîtront plus dans les prochains exports « non basculés ».`,"Marquer",false)){
    try{await chk(S.sb.from("paiements").update({compta:today()}).in("id",todo.map(p=>p.id)));toast("Bascule enregistrée");reload();}catch(e){toast("Marquage impossible : "+errMsg(e));}
  }
}

async function readTable(f){
  if(/\.(xlsx?|ods)$/i.test(f.name||"")){
    if(!window.XLSX)throw new Error("module Excel non chargé, vérifiez la connexion");
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}).map(r=>r.map(v=>v instanceof Date?v.toISOString().slice(0,10):String(v??"")));
  }
  return parseCSV(await f.text());
}
function parseCSV(t){
  t=t.replace(/^﻿/,"");const first=t.split(/\r?\n/)[0];
  const cnt=ch=>(first.split(ch).length-1);const sep=cnt("\t")>cnt(";")&&cnt("\t")>cnt(",")?"\t":(cnt(";")>=cnt(",")?";":",");
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=ch;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}

  let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return`${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;}return"";}

async function compresse(file){
  if(!/^image\//.test(file.type||""))return file;
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("image illisible"));i.src=url;});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement("canvas");cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);return await new Promise(r=>cv.toBlob(r,"image/jpeg",.75));}
  finally{URL.revokeObjectURL(url);}
}
async function envoyerRib(membreId,file){
  const blob=await compresse(file),ext=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name||"")?"pdf":"jpg";
  const path=`${membreId}/${uid()}.${ext}`;
  const {error}=await S.sb.storage.from("rib").upload(path,blob,{contentType:ext==="pdf"?"application/pdf":"image/jpeg"});
  if(error)throw error;return path;
}

        ${P.ribPath?`<p class="note"><a class="lnk" href="#" id="ribVoir">Voir le RIB joint</a></p>`:""}
        <label class="f"><span>Titulaire du compte</span><input id="pTit" value="${esc(P.titulaire||"")}" placeholder="${esc((m.prenom+" "+m.nom).trim())}"></label>

        <label class="f"><span>BIC (facultatif)</span><input id="pBic" class="mono" value="${esc(P.bic||"")}" autocapitalize="characters"></label>

    <div class="btns"><button class="btn danger" id="fDel">Supprimer la fiche</button></div>`:""}`,p=>{
    const ML=mails(m.email);
    const drawM=()=>{$("#fMails",p).innerHTML=ML.map((e,i)=>`<span class="mchip">${esc(e)}<button type="button" data-rm="${i}" aria-label="Effacer ${esc(e)}">×</button></span>`).join("");
      $$("[data-rm]",p).forEach(b=>b.onclick=()=>{ML.splice(+b.dataset.rm,1);drawM();});};
    const addM=()=>{const v=mails($("#fMail",p).value);if(!v.length)return true;const bad=v.find(e=>!mailOk(e));if(bad){toast("Adresse mail invalide : "+bad);return false;}
      v.forEach(e=>{if(!ML.includes(e))ML.push(e);});$("#fMail",p).value="";drawM();return true;};
    $("#fMailAdd",p).onclick=addM;$("#fMail",p).onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addM();}};drawM();
    if(S.isAdmin){
    $("#pAct",p).onchange=e=>{$("#pBox",p).style.display=e.target.checked?"":"none";};
    const rv=$("#ribVoir",p);if(rv)rv.onclick=e=>{e.preventDefault();voirRib(P.ribPath);};
    const ibSt=()=>{const v=$("#pIban",p).value;$("#ibanSt",p).innerHTML=!v?"":(ibanOk(v)?'<span class="ok-t">IBAN valide</span>':'<span class="bad-t">IBAN invalide</span>');};
    $("#pIban",p).oninput=ibSt;$("#pIban",p).onblur=e=>{e.target.value=ibanFmt(e.target.value);ibSt();};ibSt();
    dropZone($("#ribDrop",p),$("#ribFile",p),async f=>{
      const st=$("#ribSt",p);$("#ribTxt",p).textContent="Envoi en cours…";st.textContent="";
      try{P.ribPath=await envoyerRib(newId,f);P.ribNom=f.name||"rib";$("#ribTxt",p).textContent="RIB joint ✓ — pensez à enregistrer la fiche";st.innerHTML='<span class="ok-t">Recopiez l\'IBAN ci-dessous à partir du RIB.</span>';}
      catch(e){$("#ribTxt",p).textContent="Échec de l'envoi — réessayer";toast("Envoi impossible : "+errMsg(e));}
    });
    }
    $("#fSave",p).onclick=async()=>{
      const d={...m,nom:$("#fNom",p).value.trim(),prenom:$("#fPre",p).value.trim(),categorie:$("#fCat",p).value,instrument:$("#fIns",p).value.trim(),email:"",tel:$("#fTel",p).value.trim(),montantPerso:S.isAdmin&&$("#fMt",p).value?num($("#fMt",p).value):"",actif:S.isAdmin?$("#fAct",p).checked:true,potentiel:S.isAdmin?$("#fPot",p).checked:false};
      delete d.id;
      if(!d.nom||!d.prenom)return toast("Le nom et le prénom sont obligatoires");
      if(!addM())return;d.email=ML.join(", ");
      const pa=S.isAdmin&&$("#pAct",p).checked;
      if(!S.isAdmin){delete d.prelevement;const dup=S.membres.find(x=>norm(x.nom)===norm(d.nom)&&norm(x.prenom)===norm(d.prenom));if(dup)return toast(`${fullName(dup)} existe déjà dans la liste`);}
      else d.prelevement={...P,actif:pa,titulaire:$("#pTit",p).value.trim(),iban:ibanClean($("#pIban",p).value),bic:$("#pBic",p).value.trim().toUpperCase().replace(/\s/g,""),rum:$("#pRum",p).value.trim(),dateSignature:$("#pSig",p).value,sequence:$("#pSeq",p).value};
      if(!S.isAdmin)d.potentiel=false;
      if(pa){
        if(!ibanOk(d.prelevement.iban))return toast("IBAN invalide");
        if(!bicOk(d.prelevement.bic))return toast("BIC invalide");
        if(!d.prelevement.rum)return toast("Référence de mandat (RUM) obligatoire");
        if(!d.prelevement.dateSignature)return toast("Indiquez la date de signature du mandat");
      }
      if(!id)d.cree=new Date().toISOString();
      d.modifie=new Date().toISOString();
      if(!S.isAdmin){delete d.actif;}
      if(await put("membres/"+newId,d)){toast("Fiche enregistrée");closeSheet();}
    };
    if(id){
      $("#fPay",p).onclick=()=>paySheet(id);
      $("#fDel",p).onclick=async()=>{if(await confirmBox(`Supprimer ${fullName(m)} ? Ses cotisations déjà enregistrées restent dans l'historique. Pour un ancien membre, préférez décocher « Fiche active ».`,"Supprimer")){if(await del("membres/"+id)){toast("Fiche supprimée");closeSheet();}}};
      $$("[data-p]",p).forEach(r=>r.onclick=()=>payDetail(r.dataset.p));
    }
  });
}

/* ----- Encaissement ----- */
function paySheet(mid,editId){
  const c=cfg(),pe=editId&&S.isAdmin?S.paiements.find(x=>x.id===editId):null;
  const MODES_OK=Object.entries(MODES).filter(([k])=>S.isAdmin||k!=="prelevement");
  let mode=pe?pe.mode:"especes",sel=pe?pe.membreId:(mid||"");
  const M=membresTri().filter(m=>m.actif!==false||m.id===sel);
  if(!M.length){toast("Ajoutez d'abord un adhérent");return memberSheet();}
  openSheet(pe?"Modifier l'encaissement":"Encaisser une cotisation",`
    <div class="card">
      <label class="f"><span>Adhérent <i>*</i></span>
        ${mid||pe?"":`<input id="yQ" type="search" placeholder="Filtrer…" style="margin-bottom:6px">`}
        <select id="yM"></select></label>
      <div id="yNew" style="display:none;border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:6px">
        <div class="two"><label class="f"><span>Prénom <i>*</i></span><input id="yNP" autocapitalize="words" autocomplete="off"></label>
        <label class="f"><span>Nom <i>*</i></span><input id="yNN" autocapitalize="characters" autocomplete="off"></label></div>
        <div class="two"><label class="f"><span>Catégorie</span><select id="yNC"><option value="">À préciser</option>${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
        <label class="f"><span>Instrument</span><input id="yNI"></label></div>
        <div class="two"><label class="f"><span>Mail</span><input id="yNM" type="text" inputmode="email" autocapitalize="off" autocomplete="off"></label>
        <label class="f"><span>Téléphone</span><input id="yNT" type="tel" autocomplete="off"></label></div>
      </div>
      <label class="f"><span>Mode de règlement</span><div class="seg" id="yMode">${MODES_OK.map(([k,l])=>`<button type="button" data-v="${k}" class="${k===mode?"on":""}">${l}</button>`).join("")}</div></label>
      <div class="two"><label class="f"><span>Montant versé (€)</span><input id="yAmt" type="number" inputmode="decimal" step="0.01"></label>
      <label class="f"><span>Date</span><input id="yDate" type="date" value="${esc(pe?pe.date:today())}"></label></div>
      <div class="ventil" id="yVen"></div>
      <div class="two"><label class="f"><span>Saison</span><input id="ySai" value="${esc(pe?pe.saison:c.saison)}" inputmode="numeric"></label>
      <label class="f"><span id="yRefL">Référence</span><input id="yRef" value="${esc(pe?pe.ref||"":"")}"></label></div>
      <label class="f"><span>Note</span><input id="yNote" value="${esc(pe?pe.note||"":"")}"></label>
    </div>
    <button class="btn gold full" id="ySave">${pe?"Enregistrer":"Valider l'encaissement"}</button>
    <p class="note" id="yHint"></p>`,p=>{
    const du=()=>montantDu(membre(sel));
    const canNew=!pe&&!mid;
    const showNew=()=>{$("#yNew",p).style.display=sel==="__new"?"":"none";};
    const fillM=f=>{const q=norm(f||"");const L=M.filter(m=>!q||norm(m.nom+m.prenom+m.instrument).includes(q));
      if(canNew&&q&&!L.length&&sel!=="__new"){sel="__new";const w=String(f).trim().split(/\s+/);if(!$("#yNP",p).value)$("#yNP",p).value=w.length>1?w[0]:"";if(!$("#yNN",p).value)$("#yNN",p).value=w.length>1?w.slice(1).join(" "):w[0];}
      $("#yM",p).innerHTML=`<option value="">— choisir —</option>`+(canNew?`<option value="__new" ${sel==="__new"?"selected":""}>+ Nouvel adhérent</option>`:"")+M.filter(m=>!q||norm(m.nom+m.prenom+m.instrument).includes(q)).map(m=>`<option value="${esc(m.id)}" ${m.id===sel?"selected":""}>${esc(fullName(m))}${aJour(m)?" ✓":(isPot(m)?" (potentiel)":"")}</option>`).join("");showNew();};
    fillM();const yq=$("#yQ",p);if(yq)yq.oninput=()=>fillM(yq.value);
    const showV=()=>{const t=r2(num($("#yAmt",p).value)),cc=Math.min(t,du()),s=r2(t-cc);$("#yVen",p).innerHTML=t>0?`<div><span>Cotisation</span><b>${eur(cc)}</b></div>${s>0?`<div><span>${esc(c.libSurplus)}</span><b>${eur(s)}</b></div>`:""}`:"";};
    $("#yAmt",p).value=pe?pe.montant:du();showV();$("#yAmt",p).oninput=showV;
    $("#yM",p).onchange=e=>{sel=e.target.value;showNew();if(sel==="__new")setTimeout(()=>$("#yNP",p).focus(),50);if(!pe)$("#yAmt",p).value=du();showV();};
    const hint=()=>{$("#yRefL",p).textContent={sumup:"N° de transaction SumUp",helloasso:"Référence HelloAsso",cheque:"N° du chèque",virement:"Référence du virement",prelevement:"Référence de la remise",especes:"Référence (facultatif)"}[mode];
      $("#yHint",p).textContent=mode==="especes"&&!pe?"Un accusé de réception numéroté sera créé pour l'adhérent.":"";};
    hint();
    $$("#yMode button",p).forEach(b=>b.onclick=()=>{mode=b.dataset.v;$$("#yMode button",p).forEach(x=>x.classList.toggle("on",x===b));hint();});
    $("#ySave",p).onclick=async()=>{
      if(!sel)return toast("Choisissez l'adhérent");
      const amt=r2(num($("#yAmt",p).value));if(amt<=0)return toast("Montant invalide");
      if(amt<du()&&!await confirmBox(`Le montant (${eurTxt(amt)}) est inférieur à la cotisation (${eurTxt(du())}). Enregistrer quand même ?`,"Enregistrer",false))return;
      const saison=$("#ySai",p).value.trim();if(!/^\d{4}$/.test(saison))return toast("Saison : une année, par exemple 2026");
      if(+saison<PREMIERE_SAISON)return toast(`Pas de saisie avant ${PREMIERE_SAISON}`);
      if(($("#yDate",p).value||today())<PREMIERE_SAISON+"-01-01")return toast(`Pas de saisie datée d'avant ${PREMIERE_SAISON}`);
      let m=membre(sel),created=false;
      if(sel==="__new"){
        const nm={nom:$("#yNN",p).value.trim(),prenom:$("#yNP",p).value.trim(),categorie:$("#yNC",p).value,instrument:$("#yNI",p).value.trim(),email:mails($("#yNM",p).value).join(", "),tel:$("#yNT",p).value.trim(),actif:true,potentiel:false,cree:new Date().toISOString()};
        if(!nm.nom||!nm.prenom)return toast("Prénom et nom du nouvel adhérent obligatoires");
        if(mails(nm.email).some(e=>!mailOk(e)))return toast("Adresse mail invalide");
        const dup=S.membres.find(x=>norm(x.nom)===norm(nm.nom)&&norm(x.prenom)===norm(nm.prenom));
        if(dup)return toast(`${fullName(dup)} existe déjà : choisissez-le dans la liste`);
        const nid=uid();if(!await put("membres/"+nid,nm))return;
        sel=nid;m={id:nid,...nm};created=true;
      }
      const d={membreId:sel,nomAffiche:fullName(m),saison,montant:amt,cotis:Math.min(amt,du()),mode,date:$("#yDate",p).value||today(),ref:$("#yRef",p).value.trim(),note:$("#yNote",p).value.trim()};
      if(pe){
        if(pe.mode!=="especes"&&mode==="especes"&&!pe.recuNum)return toast("Pour passer en espèces, annulez et ressaisissez l'encaissement");
        if(await upd("paiements/"+pe.id,d)){toast("Encaissement modifié");closeSheet();}
        return;
      }
      $("#ySave",p).disabled=true;
      const row=await insertPaiement({...d,id:uid()});
      $("#ySave",p).disabled=false;
      if(row){
        toast(created?"Adhérent créé et encaissement enregistré":"Encaissement enregistré");
        if(mode==="especes")recuSheet(row);else closeSheet();
      }
    };
  });
}
function payDetail(pid){
  const p=S.paiementsAll.find(x=>x.id===pid);if(!p)return;const m=membre(p.membreId),v=ventil(p),c=cfg();
  const mien=p.encaissePar===S.uid;
  openSheet("Encaissement",`<div class="card">
      <div style="font-size:28px;font-weight:750;${p.annule?"text-decoration:line-through;opacity:.6":""}">${eur(p.montant)}</div>
      <p>${p.annule?'<span class="chip bad" style="margin:0">Annulé</span>':`<span class="chip ${p.mode}" style="margin:0">${MODES[p.mode]||esc(p.mode)}</span>`}${p.compta?`<span class="chip ok">Compta ${fd(p.compta)}</span>`:""}${p.mode==="especes"&&p.remisLe?`<span class="chip ok">Remis le ${fd(p.remisLe)}</span>`:""}</p>
      <div class="ventil"><div><span>Cotisation</span><b>${eur(v.cotis)}</b></div>${v.surplus>0?`<div><span>${esc(c.libSurplus)}</span><b>${eur(v.surplus)}</b></div>`:""}</div>
      <p><b>${esc(m?fullName(m):p.nomAffiche)}</b><br>Saison ${esc(p.saison)} · ${fd(p.date)}${p.ref?"<br>Réf. "+esc(p.ref):""}${p.recuNum?"<br>Reçu "+esc(p.recuNum):""}${p.note?"<br>"+esc(p.note):""}<br><span class="note">Encaissé par ${esc(nomProfil(p.encaissePar))}</span></p>
      ${p.annule?`<div class="banner">Annulé par ${esc(nomProfil(p.annulePar))} le ${fd(String(p.annuleLe||"").slice(0,10))}${p.annuleMotif?" : "+esc(p.annuleMotif):""}</div>`:""}
      ${p.signalement?`<div class="banner">${p.signalementTraite?"Signalement traité":"Erreur signalée"} : « ${esc(p.signalement)} »</div>`:""}
    </div>
    ${p.annule?"":`<div class="btns">${p.recuNum?`<button class="btn gold" id="dR">Accusé de réception</button>`:""}${S.isAdmin&&!p.compta?`<button class="btn" id="dE">Modifier</button>`:""}</div>
    ${S.isAdmin?(p.compta?`<p class="note">Déjà en comptabilité : pour une erreur, enregistrez une correction (contrepassation) dans votre logiciel comptable.</p>`:`<div class="btns">${p.signalement&&!p.signalementTraite?`<button class="btn sec" id="dT">Marquer le signalement comme traité</button>`:""}<button class="btn danger" id="dA">Annuler l'encaissement</button></div>`)
      :(mien?`<div class="btns"><button class="btn sec" id="dS">${p.signalement&&!p.signalementTraite?"Modifier le signalement":"Signaler une erreur au trésorier"}</button></div>`:"")}`}`,el=>{
    const r=$("#dR",el);if(r)r.onclick=()=>recuSheet(p);
    const e=$("#dE",el);if(e)e.onclick=()=>paySheet(null,pid);
    const t=$("#dT",el);if(t)t.onclick=async()=>{if(await upd("paiements/"+pid,{signalementTraite:true})){toast("Signalement traité");closeSheet();}};
    const a=$("#dA",el);if(a)a.onclick=()=>openSheet("Annuler l'encaissement",`<div class="card"><p style="margin-top:0">${esc(m?fullName(m):p.nomAffiche)} · ${eur(p.montant)} · ${MODES[p.mode]||""}</p><label class="f"><span>Motif de l'annulation <i>*</i></span><input id="aM" value="${esc(p.signalement||"")}" placeholder="Erreur de montant, doublon, mauvais adhérent…"></label></div>
      <p class="note">L'encaissement reste visible dans l'historique, barré, avec votre nom et le motif. Il n'est plus compté nulle part.</p><button class="btn danger full" id="aOk">Annuler l'encaissement</button>`,q=>{
      $("#aOk",q).onclick=async()=>{const mo=$("#aM",q).value.trim();if(!mo)return toast("Indiquez le motif");
        if(await upd("paiements/"+pid,{annule:true,annulePar:S.uid,annuleLe:new Date().toISOString(),annuleMotif:mo,signalementTraite:true})){toast("Encaissement annulé");closeSheet();}};});
    const sg=$("#dS",el);if(sg)sg.onclick=()=>openSheet("Signaler une erreur",`<div class="card"><p style="margin-top:0">${esc(m?fullName(m):p.nomAffiche)} · ${eur(p.montant)}</p><label class="f"><span>Que faut-il corriger ?</span><textarea id="sT" style="min-height:90px" placeholder="Ex. : le montant était de 15 €, pas 10 €">${esc(p.signalementTraite?"":p.signalement||"")}</textarea></label></div><button class="btn gold full" id="sOk">Envoyer au trésorier</button>`,q=>{
      $("#sOk",q).onclick=async()=>{const tx=$("#sT",q).value.trim();if(!tx)return toast("Décrivez l'erreur");
        const {error}=await S.sb.rpc("signaler_erreur",{p_id:pid,p_texte:tx});if(error)return toast("Impossible : "+errMsg(error));toast("Signalement envoyé");reload();closeSheet();};});
  });
}

/* ----- Accusé de réception espèces ----- */
function recuTexte(p){
  const c=cfg(),m=membre(p.membreId),v=ventil(p);
  return`${c.asso}\n${c.adresse?c.adresse+"\n":""}\nACCUSÉ DE RÉCEPTION N° ${p.recuNum||"—"}\n\nL'${c.asso} reconnaît avoir reçu de ${m?fullName(m):p.nomAffiche} la somme de ${eurTxt(v.total)} en espèces, le ${fd(p.date)}, au titre de la saison ${p.saison}.\n\nCotisation : ${eurTxt(v.cotis)}${v.surplus>0?`\n${c.libSurplus} : ${eurTxt(v.surplus)}`:""}\n\nPour l'association${c.tresorier?", "+c.tresorier:""}\n\nCe document atteste le versement en espèces. Il ne constitue pas un reçu fiscal.`;
}
function recuSheet(p){
  const c=cfg(),m=membre(p.membreId),v=ventil(p);
  openSheet("Accusé de réception "+(p.recuNum||""),`
    <div class="recu"><span class="n">N° ${esc(p.recuNum||"—")}</span><h4>${esc(c.asso)}</h4><div style="white-space:pre-line;color:#555;font-size:13px">${esc(c.adresse)}</div>
      <p style="margin-top:14px">Reçu de <b>${esc(m?fullName(m):p.nomAffiche)}</b></p>
      <div class="amt">${eur(v.total)} en espèces</div>
      <div class="ventil"><div><span>Cotisation</span><b>${eur(v.cotis)}</b></div>${v.surplus>0?`<div><span>${esc(c.libSurplus)}</span><b>${eur(v.surplus)}</b></div>`:""}</div>
      <p>le ${fd(p.date)} · saison ${esc(p.saison)}</p>
      <p style="margin-top:18px">Pour l'association${c.tresorier?", "+esc(c.tresorier):""}</p>
      <small>Ce document atteste le versement en espèces. Il ne constitue pas un reçu fiscal.</small></div>
    <div class="btns"><button class="btn gold" id="rPdf">Télécharger le PDF</button></div>
    <div class="btns">${m&&m.email?`<a class="btn" href="${esc(mailHref(m.email,`Accusé de réception ${p.recuNum} – saison ${p.saison}`,recuTexte(p)))}" target="_blank" rel="noopener">Envoyer par mail</a>`:""}<button class="btn sec" id="rCp">Copier le texte</button></div>
    ${m&&m.email?`<p class="note">Mail de l'adhérent : ${esc(m.email)}. Si Mail ne s'ouvre pas, copiez le texte.</p>`:`<p class="note">Pas d'adresse mail pour cet adhérent : téléchargez le PDF pour l'envoyer ou l'imprimer.</p>`}
    <button class="btn sec full" data-close>Terminer</button>`,el=>{
    $("#rCp",el).onclick=()=>copy(recuTexte(p));
    $("#rPdf",el).onclick=async()=>{try{await saveFile(`recu-${p.recuNum||"especes"}.pdf`,recuPdf(p));}catch(e){toast(e.message);}};
  });
}
function recuPdf(p){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error("Module PDF non chargé : vérifiez la connexion");
  const c=cfg(),m=membre(p.membreId),v=ventil(p),clean=s=>String(s||"").replace(/[  ]/g," ").replace(/€/g,"EUR");
  const money=n=>r2(n).toFixed(2).replace(".",",")+" EUR";
  const d=new J({unit:"mm",format:"a5"}),W=148;let y=18;
  d.setDrawColor(201,161,59);d.setLineWidth(1);d.line(12,10,W-12,10);
  d.setFont("helvetica","bold");d.setFontSize(13);d.splitTextToSize(clean(c.asso),95).forEach(l=>{d.text(l,12,y);y+=6;});
  d.setFont("helvetica","normal");d.setFontSize(9);if(c.adresse)clean(c.adresse).split("\n").forEach(l=>{d.text(l,12,y);y+=4.5;});
  d.setFont("helvetica","bold");d.setFontSize(10);d.text("N° "+clean(p.recuNum||"-"),W-12,18,{align:"right"});
  y=Math.max(y,40)+6;d.setFontSize(16);d.text("Accusé de réception",12,y);y+=10;
  d.setFont("helvetica","normal");d.setFontSize(11);
  const txt=`L'${clean(c.asso)} reconnaît avoir reçu de ${clean(m?fullName(m):p.nomAffiche)} la somme de ${money(v.total)} en espèces, le ${fd(p.date)}, au titre de la saison ${clean(p.saison)}.`;
  d.splitTextToSize(txt,W-24).forEach(l=>{d.text(l,12,y);y+=6;});
  y+=4;d.setFontSize(10);d.text("Cotisation",12,y);d.text(money(v.cotis),W-12,y,{align:"right"});
  if(v.surplus>0){y+=6;d.text(clean(c.libSurplus),12,y);d.text(money(v.surplus),W-12,y,{align:"right"});}
  y+=7;d.setFont("helvetica","bold");d.setFontSize(14);d.text("Total",12,y);d.text(money(v.total),W-12,y,{align:"right"});
  y+=14;d.setFont("helvetica","normal");d.setFontSize(10);d.text(`Fait le ${fd(today())}`,12,y);y+=6;d.text("Pour l'association"+(c.tresorier?", "+clean(c.tresorier):""),12,y);
  y+=6;d.setDrawColor(180);d.setLineWidth(.3);d.rect(12,y,60,22);d.setFontSize(8);d.setTextColor(140);d.text("Signature",14,y+4);
  d.setTextColor(110);d.setFontSize(8);d.text("Ce document atteste le versement en espèces. Il ne constitue pas un reçu fiscal.",12,198);
  return d.output("blob");
}

/* ----- Événements ----- */
function eventEdit(id){
  const e=id?S.evenements.find(x=>x.id===id):{titre:"",date:"",heure:"",lieu:"",description:"",places:""};if(!e)return;
  openSheet(id?"Modifier l'événement":"Nouvel événement",`<div class="card">
    <label class="f"><span>Titre <i>*</i></span><input id="eT" value="${esc(e.titre)}" placeholder="Concert, répétition, assemblée générale…"></label>
    <div class="two"><label class="f"><span>Date <i>*</i></span><input id="eD" type="date" value="${esc(e.date)}"></label><label class="f"><span>Heure</span><input id="eH" type="time" value="${esc(e.heure)}"></label></div>
    <label class="f"><span>Lieu</span><input id="eL" value="${esc(e.lieu)}"></label>
    <label class="f"><span>Places (facultatif)</span><input id="eP" type="number" value="${esc(e.places)}"></label>
    <label class="f"><span>Description</span><textarea id="eDe">${esc(e.description)}</textarea></label></div>
    <button class="btn gold full" id="eS">Enregistrer</button>${id?`<div class="btns"><button class="btn danger" id="eX">Supprimer l'événement</button></div>`:""}`,p=>{
    $("#eS",p).onclick=async()=>{
      const d={titre:$("#eT",p).value.trim(),date:$("#eD",p).value,heure:$("#eH",p).value,lieu:$("#eL",p).value.trim(),places:$("#eP",p).value?num($("#eP",p).value):"",description:$("#eDe",p).value.trim()};
      if(!d.titre||!d.date)return toast("Titre et date obligatoires");
      if(await put("evenements/"+(id||uid()),d)){toast("Événement enregistré");closeSheet();}
    };
    const x=$("#eX",p);if(x)x.onclick=async()=>{if(await confirmBox("Supprimer cet événement ?","Supprimer")){if(await del("evenements/"+id)){toast("Événement supprimé");closeSheet();}}};

function eventSheet(id){
  const e=S.evenements.find(x=>x.id===id);if(!e)return;
  const L=inscrits(id).map(i=>membre(i.membreId)).filter(Boolean).sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr"));
  const ids=new Set(L.map(m=>m.id));
  const autres=membresTri().filter(m=>isMembre(m)&&!ids.has(m.id));
  openSheet(e.titre,`<div class="card"><b>${fd(e.date)} ${esc(e.heure||"")}</b>${e.lieu?"<br>"+esc(e.lieu):""}${e.description?`<p style="white-space:pre-line">${esc(e.description)}</p>`:""}</div>
    <h3>Inscrits (${L.length}${e.places?"/"+esc(e.places):""})</h3>
    ${L.length?`<div class="list">${L.map(m=>`<div class="row" style="cursor:default"><div class="av">${esc(initials(m))}</div><div class="main"><b>${esc(fullName(m))}</b>${m.instrument?`<small>${esc(m.instrument)}</small>`:""}</div><div class="right"><button class="btn sm danger" data-rm="${esc(m.id)}">Retirer</button></div></div>`).join("")}</div>`:`<div class="note">Personne pour l'instant.</div>`}
    <h3>Inscrire un adhérent</h3><div class="card"><select id="iAdd"><option value="">— choisir —</option>${autres.map(m=>`<option value="${esc(m.id)}">${esc(fullName(m))}</option>`).join("")}</select><div class="btns"><button class="btn" id="iAddB">Inscrire</button></div></div>
    <div class="btns"><button class="btn sec" id="eEd">Modifier</button>${L.length?`<button class="btn sec" id="eCp">Copier la liste</button>`:""}</div>`,p=>{
    const again=()=>setTimeout(()=>{if(!$("#sheet").classList.contains("hidden"))eventSheet(id);},400);
    $$("[data-rm]",p).forEach(b=>b.onclick=async()=>{try{await chk(S.sb.from("inscriptions").delete().eq("evenementId",id).eq("membreId",b.dataset.rm));reload();again();}catch(er){toast("Impossible : "+errMsg(er));}});
    $("#iAddB",p).onclick=async()=>{const mid=$("#iAdd",p).value;if(!mid)return;if(e.places&&L.length>=num(e.places)&&!await confirmBox("L'événement est complet. Inscrire quand même ?","Inscrire",false))return;
      try{await chk(S.sb.from("inscriptions").insert({evenementId:id,membreId:mid}));reload();again();}catch(er){toast("Impossible : "+errMsg(er));}};
    $("#eEd",p).onclick=()=>eventEdit(id);
    const cp=$("#eCp",p);if(cp)cp.onclick=()=>copy(`${e.titre} – ${fd(e.date)}\n`+L.map(m=>"- "+fullName(m)).join("\n"));
  });
}

/* ================= DEMARRAGE ================= */
const CONFIG_OK=!!(window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&!/A_COMPLETER/.test(window.SUPABASE_URL+window.SUPABASE_ANON_KEY)&&window.supabase);
let reloadH=0,channel=null;
function reload(){clearTimeout(reloadH);reloadH=setTimeout(loadAll,250);}
async function loadAll(){
  if(!S.session)return;
  try{
    const q=t=>S.sb.from(t).select("*");
    const [cf,pr,me,pa,ev,ins,md]=await Promise.all([q("config"),q("profils"),q("membres"),q("paiements"),S.isAdmin?q("evenements"):Promise.resolve({data:[]}),S.isAdmin?q("inscriptions"):Promise.resolve({data:[]}),S.isAdmin?q("mandats"):Promise.resolve({data:[]})]);
    for(const r of [cf,pr,me,pa,ev,ins,md])if(r.error)throw r.error;
    S.config=(cf.data[0]&&cf.data[0].data)||null;S.profils=pr.data;
    const mand={};md.data.forEach(x=>mand[x.membreId]=x);
    S.membres=me.data.map(m=>mand[m.id]?{...m,prelevement:mand[m.id]}:m);
    S.paiementsAll=pa.data.map(p=>({...p,montant:num(p.montant),cotis:p.cotis==null?null:num(p.cotis)}));S.paiements=S.paiementsAll.filter(p=>!p.annule);
    S.evenements=ev.data;S.inscriptions=ins.data;S.offline=false;
  }catch(e){S.offline=true;console.error(e);}
  refresh();
}
async function start(){
  const {data:{session}}=await S.sb.auth.getSession();
  S.session=session;S.uid=session&&session.user.id;S.profil=null;S.isAdmin=false;
  if(session&&!S.recovery){
    const {data,error}=await S.sb.from("profils").select("*").eq("id",S.uid).maybeSingle();
    if(error||!data){S.session=null;go();$("#view").insertAdjacentHTML("beforeend",`<div class="banner" style="max-width:380px;margin:0 auto">Ce compte n'a pas encore d'accès à l'appli. Demandez au trésorier.</div>`);await S.sb.auth.signOut({scope:"local"});return;}
    S.profil=data;S.isAdmin=data.role==="admin";S.myName=data.nom;
    await loadAll();
    if(!channel){channel=S.sb.channel("amicale").on("postgres_changes",{event:"*",schema:"public"},()=>reload()).subscribe();}
  }else if(channel){S.sb.removeChannel(channel);channel=null;}
  go();
}
(function init(){
  if(!CONFIG_OK){go();return;}
  S.sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  S.sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY"){S.recovery=true;go();return;}if(ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(start,0);});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.session)reload();});
  setInterval(()=>{if(S.session&&!document.hidden)reload();},60000);
  start();
})();
</script>
<script>
/* Écran « Mise à jour du listing » (administrateur) :
   compare un nouveau listing du personnel aux fiches, ajoute les nouveaux,
   met à jour mails et téléphones, efface les adresses qui n'y figurent plus. */
(function(){
  if(typeof VIEWS==="undefined")return;
  SUBVIEWS.push("listing");
  const plusShell=VIEWS.plus.shell;
  VIEWS.plus.shell=()=>{const h=plusShell();if(!S.isAdmin)return h;
    return h.replace('<a class="row" href="#import"','<a class="row" href="#listing" style="text-decoration:none;color:inherit"><div class="main"><b>Mise à jour du listing</b><small>Nouveau listing du personnel · mails et téléphones</small></div><div class="right">›</div></a><a class="row" href="#import"');};

  const baseNom=s=>norm(String(s||"").replace(/\(.*?\)/g,""));
  const chiffres=s=>String(s||"").replace(/\D/g,"").replace(/^33/,"0");
  let A=null; // analyse en cours
  let mode="remplacer";

  function lire(rows){
    rows=rows.map(r=>r.map(c=>String(c??"").trim())).filter(r=>r.some(Boolean));
    const hi=rows.slice(0,15).findIndex(r=>r.some(c=>/^nom( de famille)?$/.test(noAcc(c).toLowerCase())));
    if(hi<0)throw new Error("colonne « NOM » introuvable");
    const H=rows[hi].map(h=>noAcc(h).toLowerCase().trim());
    const f=(...pats)=>{for(const p of pats){const i=H.findIndex(h=>p.test(h));if(i>=0)return i;}return -1;};
    const c={nom:f(/^nom( de famille)?$/,/^nom\b/),prenom:f(/^prenom/,/prenom/),service:f(/^service/),
      email:f(/e-?mail/,/courriel/,/^mail/),tel:f(/portable/,/mobile/,/telephone/,/^tel/),categorie:f(/categorie/)};
    if(c.prenom<0)throw new Error("colonne « PRÉNOM » introuvable");
    const g=(r,k)=>c[k]>=0?String(r[c[k]]||"").trim():"";
    return rows.slice(hi+1).map(r=>{
      const cat=g(r,"categorie");
      return {nom:g(r,"nom"),prenom:g(r,"prenom"),service:g(r,"service"),email:mails(g(r,"email")).filter(mailOk),tel:g(r,"tel"),
        categorie:CATS.find(x=>norm(x)===norm(cat))||""};
    }).filter(l=>l.nom&&l.prenom);
  }

  function analyser(lignes){
    const pris=new Set(),nouveaux=[],modifs=[];
    lignes.forEach(l=>{
      const libres=S.membres.filter(m=>!pris.has(m.id));
      let cand=libres.filter(m=>norm(m.nom)===norm(l.nom)&&norm(m.prenom)===norm(l.prenom));
      if(!cand.length)cand=libres.filter(m=>baseNom(m.nom)===baseNom(l.nom)&&norm(m.prenom)===norm(l.prenom));
      if(cand.length>1&&l.service)cand=cand.filter(m=>norm(m.service)===norm(l.service)).concat(cand.filter(m=>norm(m.service)!==norm(l.service)));
      const m=cand[0];
      if(!m){nouveaux.push({l,on:true});return;}
      pris.add(m.id);
      const avant=mails(m.email),plus=l.email.filter(e=>!avant.includes(e)),moins=avant.filter(e=>!l.email.includes(e));
      const telNouv=l.tel&&chiffres(l.tel)!==chiffres(m.tel)?l.tel:"",telPlus=!l.tel&&m.tel?m.tel:"";
      const nom=l.nom!==m.nom?l.nom:"",service=l.service&&l.service!==(m.service||"")?l.service:"",categorie=l.categorie&&!m.categorie?l.categorie:"";
      if(plus.length||moins.length||telNouv||telPlus||nom||service||categorie)
        modifs.push({m,l,avant,plus,moins,garder:new Set(),telNouv,telPlus,nom,service,categorie,on:true});
    });
    const absents=S.membres.filter(m=>!pris.has(m.id)&&m.actif!==false&&(/listing/i.test(m.source||"")||m.potentiel===true)).map(m=>({m,on:false}));
    return {lignes,nouveaux,modifs,absents};
  }

  // Ce qui sera réellement écrit pour une modification, selon le mode.
  function cible(x){
    const out={};
    const emails=mode==="remplacer"?[...x.l.email,...x.moins.filter(e=>x.garder.has(e))]:[...x.avant,...x.plus];
    const avant=x.avant.join(", "),apres=[...new Set(emails)].join(", ");
    if(apres!==avant)out.email=apres;
    if(x.telNouv&&(mode==="remplacer"||!x.m.tel))out.tel=x.telNouv;
    if(x.nom)out.nom=x.nom;
    if(x.service)out.service=x.service;
    if(x.categorie)out.categorie=x.categorie;
    return out;
  }
  const utile=x=>Object.keys(cible(x)).length>0;

  function rendre(){
    const el=$("#lsRes");if(!el)return;
    if(!A){el.innerHTML="";return;}
    const mods=A.modifs.filter(utile);
    const nbEff=mods.filter(x=>x.on).reduce((n,x)=>n+(mode==="remplacer"?x.moins.filter(e=>!x.garder.has(e)).length:0),0);
    el.innerHTML=`<div class="card"><b>${A.lignes.length} personnes dans le listing</b><p class="note" style="margin-bottom:0">${A.nouveaux.length} nouvelle${A.nouveaux.length>1?"s":""} · ${mods.length} fiche${mods.length>1?"s":""} à mettre à jour · ${A.absents.length} absente${A.absents.length>1?"s":""} du listing</p></div>
      ${mods.length?`<h3>Mises à jour</h3><p class="note">${mode==="remplacer"?"Barré en rouge : adresse effacée. Touchez-la pour la conserver.":"Mode compléter : rien n'est effacé."}</p>
      <div class="list">${A.modifs.map((x,i)=>{if(!utile(x))return"";const t=cible(x);
        const chips=[...x.plus.map(e=>`<span class="mchip add">+ ${esc(e)}</span>`),
          ...(mode==="remplacer"?x.moins.map(e=>`<span class="mchip del ${x.garder.has(e)?"keep":""}" data-g="${i}" data-e="${esc(e)}">${esc(e)}</span>`):[])].join(" ");
        const autres=[t.nom?`nom : ${esc(x.m.nom)} → ${esc(t.nom)}`:"",t.tel?`tél. : ${esc(x.m.tel||"—")} → ${esc(t.tel)}`:"",(x.telPlus&&mode==="remplacer")?`tél. ${esc(x.telPlus)} absent du listing (conservé)`:"",
          t.service?`service : ${esc(t.service)}`:"",t.categorie?`catégorie : ${esc(t.categorie)}`:""].filter(Boolean).join(" · ");
        return`<div class="row" style="cursor:default;align-items:flex-start"><input type="checkbox" data-mo="${i}" ${x.on?"checked":""} style="margin-top:4px"><div class="main"><b>${esc(fullName(x.m))}</b>${chips?`<div class="mails" style="margin-top:6px">${chips}</div>`:""}${autres?`<small>${autres}</small>`:""}</div></div>`;}).join("")}</div>`:""}
      ${A.nouveaux.length?`<h3>Nouveaux (ajoutés comme adhérents potentiels)</h3><div class="list">${A.nouveaux.map((x,i)=>`<label class="row" style="cursor:pointer"><input type="checkbox" data-nv="${i}" ${x.on?"checked":""}><div class="main"><b>${esc(x.l.prenom)} ${esc(x.l.nom.toUpperCase())}</b><small>${esc([x.l.service,x.l.email.join(", "),x.l.tel].filter(Boolean).join(" · ")||"—")}</small></div></label>`).join("")}</div>`:""}
      ${A.absents.length?`<h3>Absents du nouveau listing</h3><p class="note">Cochez ceux dont la fiche doit être désactivée (elle reste consultable, rien n'est supprimé).</p><div class="list">${A.absents.map((x,i)=>`<label class="row" style="cursor:pointer"><input type="checkbox" data-ab="${i}" ${x.on?"checked":""}><div class="main"><b>${esc(fullName(x.m))}</b><small>${esc([x.m.service,aJour(x.m)?"à jour de cotisation":""].filter(Boolean).join(" · ")||"—")}</small></div></label>`).join("")}</div>`:""}
      <div class="btns"><button class="btn gold full" id="lsGo">Appliquer${nbEff?` (${nbEff} adresse${nbEff>1?"s":""} effacée${nbEff>1?"s":""})`:""}</button></div><p class="note" id="lsSt"></p>`;
    $$("[data-mo]",el).forEach(b=>b.onchange=()=>{A.modifs[+b.dataset.mo].on=b.checked;rendre();});
    $$("[data-nv]",el).forEach(b=>b.onchange=()=>{A.nouveaux[+b.dataset.nv].on=b.checked;});
    $$("[data-ab]",el).forEach(b=>b.onchange=()=>{A.absents[+b.dataset.ab].on=b.checked;});
    $$("[data-g]",el).forEach(b=>b.onclick=()=>{const x=A.modifs[+b.dataset.g],e=b.dataset.e;x.garder.has(e)?x.garder.delete(e):x.garder.add(e);rendre();});
    $("#lsGo",el).onclick=appliquer;
  }

  async function appliquer(){
    const mods=A.modifs.filter(x=>x.on&&utile(x)),nv=A.nouveaux.filter(x=>x.on),ab=A.absents.filter(x=>x.on);
    if(!mods.length&&!nv.length&&!ab.length)return toast("Rien à appliquer");
    if(!await confirmBox(`Mettre à jour ${mods.length} fiche${mods.length>1?"s":""}, ajouter ${nv.length} personne${nv.length>1?"s":""} et désactiver ${ab.length} fiche${ab.length>1?"s":""} ?`,"Appliquer",false))return;
    const st=$("#lsSt"),go=$("#lsGo");go.disabled=true;let ok=0,ko=0,n=0;const tot=mods.length+nv.length+ab.length;
    const pas=r=>{r?ok++:ko++;n++;st.textContent=`${n} / ${tot}…`;};
    const source="Listing personnel "+new Date().toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
    for(const x of mods)pas(await upd("membres/"+x.m.id,{...cible(x),modifie:new Date().toISOString()},true));
    for(const x of nv)pas(await put("membres/"+uid(),{nom:x.l.nom,prenom:x.l.prenom,service:x.l.service,categorie:x.l.categorie,email:x.l.email.join(", "),tel:x.l.tel,instrument:"",actif:true,potentiel:true,source,cree:new Date().toISOString()}));
    for(const x of ab)pas(await upd("membres/"+x.m.id,{actif:false,modifie:new Date().toISOString()},true));
    go.disabled=false;
    toast(ko?`${ok} enregistrés, ${ko} en échec`:`Listing appliqué : ${ok} modification${ok>1?"s":""}`);
    if(!ko){A=null;st.textContent="";$("#lsRes").innerHTML=`<div class="banner ok">Listing appliqué : ${mods.length} fiche${mods.length>1?"s":""} mise${mods.length>1?"s":""} à jour, ${nv.length} ajoutée${nv.length>1?"s":""}, ${ab.length} désactivée${ab.length>1?"s":""}.</div>`;}
  }

  VIEWS.listing={
    shell:()=>`<a class="back" href="#plus">‹ Plus</a>${intro("Le personnel","Mise à jour du listing","Déposez le nouveau listing : rien n'est écrit avant « Appliquer ».")}
      <div class="seg" id="lsMode"><button data-v="remplacer" class="${mode==="remplacer"?"on":""}">Le listing fait foi</button><button data-v="completer" class="${mode==="completer"?"on":""}">Compléter seulement</button></div>
      <p class="note">${"« Le listing fait foi » : les mails et téléphones des fiches sont remplacés par ceux du listing, les adresses qui n'y figurent plus sont effacées. « Compléter seulement » : ajoute ce qui manque, n'efface rien."}</p>
      <label class="drop" id="lsDrop" style="margin-top:12px"><input type="file" id="lsFile" accept=".ods,.xlsx,.xls,.csv,application/vnd.oasis.opendocument.spreadsheet,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>Glissez le listing (ODS, Excel ou CSV) ici ou touchez pour le choisir</label>
      <p class="note">Colonnes reconnues : NOM, PRÉNOM, Service, E-mail (plusieurs adresses séparées par « ; »), Téléphone portable, Catégorie.</p>
      <div id="lsRes"></div>`,
    bind(){
      $$("#lsMode button").forEach(b=>b.onclick=()=>{mode=b.dataset.v;$$("#lsMode button").forEach(x=>x.classList.toggle("on",x===b));rendre();});
      dropZone($("#lsDrop"),$("#lsFile"),async f=>{try{A=analyser(lire(await readTable(f)));rendre();}catch(e){toast("Fichier illisible : "+e.message);}});
      rendre();
    },
    update(){}
  };
})();
</script>
</body>
</html>
