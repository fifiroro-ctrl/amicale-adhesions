<script>
/* Écran « Mise à jour du listing » (administrateur) :
   compare un nouveau listing du personnel aux fiches, ajoute les nouveaux,
   met à jour mails et téléphones, efface les adresses qui n'y figurent plus. */
(function(){
  if(typeof VIEWS==="undefined")return;
  SUBVIEWS.push("listing");
  const plusShell=VIEWS.plus.shell;
  VIEWS.plus.shell=()=>{const h=plusShell();if(!S.isAdmin)return h;
    return h.replace('<a class="row" href="#import"','<a class="row" href="#listing" style="text-decoration:none;color:inherit"><div class="main"><b>Mise à jour du listing</b><small>Nouveau listing du personnel ou fiches Contacts</small></div><div class="right">›</div></a><a class="row" href="#import"');};

  const baseNom=s=>norm(String(s||"").replace(/\(.*?\)/g,""));
  const chiffres=s=>String(s||"").replace(/\D/g,"").replace(/^33/,"0");
  let A=null; // analyse en cours
  let mode="remplacer";

  function lire(rows){
    rows=rows.map(r=>r.map(c=>String(c??"").trim())).filter(r=>r.some(Boolean));
    const hi=rows.slice(0,15).findIndex(r=>r.some(c=>/^nom( de famille)?$/.test(noAcc(c).toLowerCase())));
    if(hi<0)throw new Error("colonne « NOM » introuvable");
    const H=rows[hi].map(h=>noAcc(h).toLowerCase().trim());
    const f=(...pats)=>{for(const p of pats){const i=H.findIndex(h=>p.test(h));if(i>=0)return i;}return -1;};
    const c={nom:f(/^nom( de famille)?$/,/^nom\b/),prenom:f(/^prenom/,/prenom/),service:f(/^service/),
      email:f(/e-?mail/,/courriel/,/^mail/),tel:f(/portable/,/mobile/,/telephone/,/^tel/),categorie:f(/categorie/)};
    if(c.prenom<0)throw new Error("colonne « PRÉNOM » introuvable");
    const g=(r,k)=>c[k]>=0?String(r[c[k]]||"").trim():"";
    return rows.slice(hi+1).map(r=>{
      const cat=g(r,"categorie");
      return {nom:g(r,"nom"),prenom:g(r,"prenom"),service:g(r,"service"),email:mails(g(r,"email")).filter(mailOk),tel:g(r,"tel"),
        categorie:CATS.find(x=>norm(x)===norm(cat))||""};
    }).filter(l=>l.nom&&l.prenom);
  }

  // Fiches Contacts (vCard, .vcf) : glissées depuis l'app Contacts du Mac ou partagées depuis l'iPhone.
  function lireVcf(t){
    t=t.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/=\n/g,"=\u0000").replace(/\n[ \t]/g,"");
    const out=[];let sans=0;
    t.split(/BEGIN:VCARD/i).slice(1).forEach(bloc=>{
      const c={n:"",fn:"",org:"",email:[],tels:[]};
      bloc.split("\n").forEach(li=>{
        const m=li.replace(/\u0000/g,"").match(/^(?:[\w-]+\.)?([A-Za-z-]+)((?:;[^:]*)?):(.*)$/);if(!m)return;
        const k=m[1].toUpperCase(),par=m[2].toUpperCase();let v=m[3];
        if(/QUOTED-PRINTABLE/.test(par)){try{v=decodeURIComponent(v.replace(/=([0-9A-F]{2})/gi,"%$1"));}catch(e){}}
        const un=x=>x.replace(/\\n/gi," ").replace(/\\([,;\\])/g,"$1").trim();
        if(k==="N")c.n=v;else if(k==="FN")c.fn=un(v);else if(k==="ORG")c.org=un(v.split(";")[0]);
        else if(k==="X-ABSHOWAS"&&/COMPANY/i.test(v))c.societe=true;
        else if(k==="EMAIL")c.email.push(un(v).toLowerCase());
        else if(k==="TEL")c.tels.push({v:un(v),mob:/CELL|IPHONE|MOBILE/.test(par)});
      });
      const p=c.n.split(/(?<!\\);/).map(x=>x.replace(/\\([,;\\])/g,"$1").trim());
      let nom=p[0]||"",prenom=p[1]||"";
      if(!nom&&!prenom&&c.fn&&!c.societe&&norm(c.fn)!==norm(c.org)){const w=c.fn.split(/\s+/);prenom=w.shift();nom=w.join(" ");}
      if(!nom||!prenom){sans++;return;}
      const tel=(c.tels.find(x=>x.mob)||c.tels[0]||{v:""}).v;
      out.push({nom,prenom,service:"",email:[...new Set(c.email)].filter(mailOk),tel,categorie:""});
    });
    if(!out.length)throw new Error(sans?"aucune fiche avec un nom et un prénom":"aucune fiche contact trouvée");
    out.ignores=sans;return out;
  }
  const estVcf=f=>/\.vcf$/i.test(f.name||"")||/vcard/i.test(f.type||"");
  async function charger(f,tous){
    try{
      const vcfs=(tous||[f]).filter(estVcf);
      if(vcfs.length){const L=lireVcf((await Promise.all(vcfs.map(x=>x.text()))).join("\n"));A=analyser(L,true);A.contacts=true;A.ignores=L.ignores||0;mode="completer";
        $$("#lsMode button").forEach(x=>x.classList.toggle("on",x.dataset.v===mode));}
      else{A=analyser(lire(await readTable(f)));}
      rendre();
    }catch(e){toast("Fichier illisible : "+e.message);}
  }
  // Une fiche Contacts lâchée n'importe où dans l'appli ouvre cet écran ; tout autre fichier lâché hors d'une zone prévue est ignoré
  // (au lieu d'être ouvert par le navigateur).
  const champTexte=t=>t&&t.closest&&t.closest("input,textarea,[contenteditable]");
  window.addEventListener("dragover",e=>{if(!champTexte(e.target))e.preventDefault();});
  window.addEventListener("drop",e=>{if(e.defaultPrevented||champTexte(e.target))return;e.preventDefault();
    const f=fichierDepose(e.dataTransfer);if(!f)return toast("Rien de lisible dans ce dépôt");const tous=e.dataTransfer.files.length?[...e.dataTransfer.files]:[f];
    if(S.isAdmin&&(/\.vcf$/i.test(f.name||"")||/vcard/i.test(f.type||""))){if(location.hash!=="#listing")location.hash="#listing";setTimeout(()=>charger(f,tous),150);}
    else toast("Déposez le fichier dans le cadre prévu");});

  function analyser(lignes,sansAbsents){
    const pris=new Set(),nouveaux=[],modifs=[];
    lignes.forEach(l=>{
      const libres=S.membres.filter(m=>!pris.has(m.id));
      let cand=libres.filter(m=>norm(m.nom)===norm(l.nom)&&norm(m.prenom)===norm(l.prenom));
      if(!cand.length)cand=libres.filter(m=>baseNom(m.nom)===baseNom(l.nom)&&norm(m.prenom)===norm(l.prenom));
      if(cand.length>1&&l.service)cand=cand.filter(m=>norm(m.service)===norm(l.service)).concat(cand.filter(m=>norm(m.service)!==norm(l.service)));
      const m=cand[0];
      if(!m){nouveaux.push({l,on:true});return;}
      pris.add(m.id);
      const avant=mails(m.email),plus=l.email.filter(e=>!avant.includes(e)),moins=avant.filter(e=>!l.email.includes(e));
      const telNouv=l.tel&&chiffres(l.tel)!==chiffres(m.tel)?l.tel:"",telPlus=!l.tel&&m.tel?m.tel:"";
      const nom=l.nom!==m.nom?l.nom:"",service=l.service&&l.service!==(m.service||"")?l.service:"",categorie=l.categorie&&!m.categorie?l.categorie:"";
      if(plus.length||moins.length||telNouv||telPlus||nom||service||categorie)
        modifs.push({m,l,avant,plus,moins,garder:new Set(),telNouv,telPlus,nom,service,categorie,on:true});
    });
    const absents=sansAbsents?[]:S.membres.filter(m=>!pris.has(m.id)&&m.actif!==false&&(/listing/i.test(m.source||"")||m.potentiel===true)).map(m=>({m,on:false}));
    return {lignes,nouveaux,modifs,absents};
  }

  // Ce qui sera réellement écrit pour une modification, selon le mode.
  function cible(x){
    const out={};
    const emails=mode==="remplacer"?[...x.l.email,...x.moins.filter(e=>x.garder.has(e))]:[...x.avant,...x.plus];
    const avant=x.avant.join(", "),apres=[...new Set(emails)].join(", ");
    if(apres!==avant)out.email=apres;
    if(x.telNouv&&(mode==="remplacer"||!x.m.tel))out.tel=x.telNouv;
    if(x.nom)out.nom=x.nom;
    if(x.service)out.service=x.service;
    if(x.categorie)out.categorie=x.categorie;
    return out;
  }
  const utile=x=>Object.keys(cible(x)).length>0;

  function rendre(){
    const el=$("#lsRes");if(!el)return;
    if(!A){el.innerHTML="";return;}
    const mods=A.modifs.filter(utile);
    const nbEff=mods.filter(x=>x.on).reduce((n,x)=>n+(mode==="remplacer"?x.moins.filter(e=>!x.garder.has(e)).length:0),0);
    el.innerHTML=`<div class="card"><b>${A.lignes.length} ${A.contacts?`fiche${A.lignes.length>1?"s":""} Contacts`:"personnes dans le listing"}</b>${A.ignores?`<p class="note" style="margin:4px 0 0">${A.ignores} fiche${A.ignores>1?"s":""} sans nom et prénom ignorée${A.ignores>1?"s":""} (sociétés…).</p>`:""}<p class="note" style="margin-bottom:0">${A.nouveaux.length} nouvelle${A.nouveaux.length>1?"s":""} · ${mods.length} fiche${mods.length>1?"s":""} à mettre à jour · ${A.absents.length} absente${A.absents.length>1?"s":""} du listing</p></div>
      ${mods.length?`<h3>Mises à jour</h3><p class="note">${mode==="remplacer"?"Barré en rouge : adresse effacée. Touchez-la pour la conserver.":"Mode compléter : rien n'est effacé."}</p>
      <div class="list">${A.modifs.map((x,i)=>{if(!utile(x))return"";const t=cible(x);
        const chips=[...x.plus.map(e=>`<span class="mchip add">+ ${esc(e)}</span>`),
          ...(mode==="remplacer"?x.moins.map(e=>`<span class="mchip del ${x.garder.has(e)?"keep":""}" data-g="${i}" data-e="${esc(e)}">${esc(e)}</span>`):[])].join(" ");
        const autres=[t.nom?`nom : ${esc(x.m.nom)} → ${esc(t.nom)}`:"",t.tel?`tél. : ${esc(x.m.tel||"—")} → ${esc(t.tel)}`:"",(x.telPlus&&mode==="remplacer")?`tél. ${esc(x.telPlus)} absent du listing (conservé)`:"",
          t.service?`service : ${esc(t.service)}`:"",t.categorie?`catégorie : ${esc(t.categorie)}`:""].filter(Boolean).join(" · ");
        return`<div class="row" style="cursor:default;align-items:flex-start"><input type="checkbox" data-mo="${i}" ${x.on?"checked":""} style="margin-top:4px"><div class="main"><b>${esc(fullName(x.m))}</b>${chips?`<div class="mails" style="margin-top:6px">${chips}</div>`:""}${autres?`<small>${autres}</small>`:""}</div></div>`;}).join("")}</div>`:""}
      ${A.nouveaux.length?`<h3>Nouveaux (ajoutés comme adhérents potentiels)</h3><div class="list">${A.nouveaux.map((x,i)=>`<label class="row" style="cursor:pointer"><input type="checkbox" data-nv="${i}" ${x.on?"checked":""}><div class="main"><b>${esc(x.l.prenom)} ${esc(x.l.nom.toUpperCase())}</b><small>${esc([x.l.service,x.l.email.join(", "),x.l.tel].filter(Boolean).join(" · ")||"—")}</small></div></label>`).join("")}</div>`:""}
      ${A.absents.length?`<h3>Absents du nouveau listing</h3><p class="note">Cochez ceux dont la fiche doit être désactivée (elle reste consultable, rien n'est supprimé).</p><div class="list">${A.absents.map((x,i)=>`<label class="row" style="cursor:pointer"><input type="checkbox" data-ab="${i}" ${x.on?"checked":""}><div class="main"><b>${esc(fullName(x.m))}</b><small>${esc([x.m.service,aJour(x.m)?"à jour de cotisation":""].filter(Boolean).join(" · ")||"—")}</small></div></label>`).join("")}</div>`:""}
      <div class="btns"><button class="btn gold full" id="lsGo">Appliquer${nbEff?` (${nbEff} adresse${nbEff>1?"s":""} effacée${nbEff>1?"s":""})`:""}</button></div><p class="note" id="lsSt"></p>`;
    $$("[data-mo]",el).forEach(b=>b.onchange=()=>{A.modifs[+b.dataset.mo].on=b.checked;rendre();});
    $$("[data-nv]",el).forEach(b=>b.onchange=()=>{A.nouveaux[+b.dataset.nv].on=b.checked;});
    $$("[data-ab]",el).forEach(b=>b.onchange=()=>{A.absents[+b.dataset.ab].on=b.checked;});
    $$("[data-g]",el).forEach(b=>b.onclick=()=>{const x=A.modifs[+b.dataset.g],e=b.dataset.e;x.garder.has(e)?x.garder.delete(e):x.garder.add(e);rendre();});
    $("#lsGo",el).onclick=appliquer;
  }

  async function appliquer(){
    const mods=A.modifs.filter(x=>x.on&&utile(x)),nv=A.nouveaux.filter(x=>x.on),ab=A.absents.filter(x=>x.on);
    if(!mods.length&&!nv.length&&!ab.length)return toast("Rien à appliquer");
    if(!await confirmBox(`Mettre à jour ${mods.length} fiche${mods.length>1?"s":""}, ajouter ${nv.length} personne${nv.length>1?"s":""} et désactiver ${ab.length} fiche${ab.length>1?"s":""} ?`,"Appliquer",false))return;
    const st=$("#lsSt"),go=$("#lsGo");go.disabled=true;let ok=0,ko=0,n=0;const tot=mods.length+nv.length+ab.length;
    const pas=r=>{r?ok++:ko++;n++;st.textContent=`${n} / ${tot}…`;};
    const source=(A.contacts?"Contacts ":"Listing personnel ")+new Date().toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
    for(const x of mods)pas(await upd("membres/"+x.m.id,{...cible(x),modifie:new Date().toISOString()},true));
    for(const x of nv)pas(await put("membres/"+uid(),{nom:x.l.nom,prenom:x.l.prenom,service:x.l.service,categorie:x.l.categorie,email:x.l.email.join(", "),tel:x.l.tel,instrument:"",actif:true,potentiel:true,source,cree:new Date().toISOString()}));
    for(const x of ab)pas(await upd("membres/"+x.m.id,{actif:false,modifie:new Date().toISOString()},true));
    go.disabled=false;
    toast(ko?`${ok} enregistrés, ${ko} en échec`:`Listing appliqué : ${ok} modification${ok>1?"s":""}`);
    if(!ko){A=null;st.textContent="";$("#lsRes").innerHTML=`<div class="banner ok">Listing appliqué : ${mods.length} fiche${mods.length>1?"s":""} mise${mods.length>1?"s":""} à jour, ${nv.length} ajoutée${nv.length>1?"s":""}, ${ab.length} désactivée${ab.length>1?"s":""}.</div>`;}
  }

  VIEWS.listing={
    shell:()=>`<a class="back" href="#plus">‹ Plus</a>${intro("Le personnel","Mise à jour du listing","Déposez le nouveau listing : rien n'est écrit avant « Appliquer ».")}
      <div class="seg" id="lsMode"><button data-v="remplacer" class="${mode==="remplacer"?"on":""}">Le listing fait foi</button><button data-v="completer" class="${mode==="completer"?"on":""}">Compléter seulement</button></div>
      <p class="note">${"« Le listing fait foi » : les mails et téléphones des fiches sont remplacés par ceux du listing, les adresses qui n'y figurent plus sont effacées. « Compléter seulement » : ajoute ce qui manque, n'efface rien."}</p>
      <label class="drop" id="lsDrop" style="margin-top:12px"><input type="file" id="lsFile" multiple accept=".ods,.xlsx,.xls,.csv,.vcf,text/vcard,text/x-vcard,application/vnd.oasis.opendocument.spreadsheet,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>Glissez ici le listing (ODS, Excel, CSV) ou des fiches de l'app Contacts, ou touchez pour choisir</label>
      <p class="note">Listing : colonnes NOM, PRÉNOM, Service, E-mail (plusieurs adresses séparées par « ; »), Téléphone portable, Catégorie.<br>Contacts : sur Mac, sélectionnez une ou plusieurs fiches dans l'app Contacts et glissez-les ici (ou n'importe où dans l'appli). Sur iPhone : Contacts › fiche › Partager le contact › Enregistrer dans Fichiers, puis touchez ce cadre. Les fiches Contacts complètent sans rien effacer.</p>
      <div id="lsRes"></div>`,
    bind(){
      $$("#lsMode button").forEach(b=>b.onclick=()=>{mode=b.dataset.v;$$("#lsMode button").forEach(x=>x.classList.toggle("on",x===b));rendre();});
      dropZone($("#lsDrop"),$("#lsFile"),charger);
      rendre();
    },
    update(){}
  };
})();
</script>
<script>
/* Écran « Accès » (administrateur) : comptes du bureau. */
(function(){
  if(typeof VIEWS==="undefined")return;
  SUBVIEWS.push("acces");
  const plusShell=VIEWS.plus.shell;
  VIEWS.plus.shell=()=>{const h=plusShell();if(!S.isAdmin)return h;
    return h.replace('<a class="row" href="#sauvegarde"','<a class="row" href="#acces" style="text-decoration:none;color:inherit"><div class="main"><b>Accès à l\'appli</b><small>Créer un compte · renvoyer le lien · retirer un accès</small></div><div class="right">›</div></a><a class="row" href="#sauvegarde"');};

  async function appel(body){
    const {data,error}=await S.sb.functions.invoke("acces",{body});
    if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error;}catch(e){}throw new Error(m);}
    if(data&&data.error)throw new Error(data.error);
    return data;
  }
  function motDePasse(){const a="abcdefghjkmnpqrstuvwxyz23456789",v=crypto.getRandomValues(new Uint32Array(12));let s="";for(let i=0;i<12;i++){s+=a[v[i]%a.length];if(i===3||i===7)s+="-";}return s;}
  const URL_APPLI=location.origin+location.pathname;
  function montrerMdp(titre,email,mdp){
    const sms=`Bonjour, voici ton accès à l'appli de l'Amicale : ${URL_APPLI}\nIdentifiant : ${email}\nMot de passe provisoire : ${mdp}\nChange-le après ta première connexion (Compte › Changer mon mot de passe).`;
    openSheet(titre,`<div class="card"><p style="margin-top:0">Transmettez ces informations à la personne (de vive voix ou par SMS). Le mot de passe ne sera plus affiché ensuite.</p>
      <label class="f"><span>Identifiant</span><input readonly value="${esc(email)}"></label>
      <label class="f"><span>Mot de passe provisoire</span><input readonly class="mono" value="${esc(mdp)}"></label></div>
      <div class="btns"><button class="btn gold" id="cpS">Copier le message</button>${""}<a class="btn sec" href="sms:?&body=${encodeURIComponent(sms)}">Envoyer par SMS</a></div>
      <button class="btn sec full" data-close>Terminé</button>`,p=>{$("#cpS",p).onclick=()=>copy(sms);});
  }

  // Renvoyer le lien de connexion (adresse de l'appli + identifiant), avec au besoin un nouveau mot de passe provisoire.
  function renvoyer(c){
    const p=c.profil,prenom=(p.nom||"").split(/\s+/)[0];
    const moiMail=((S.session&&S.session.user&&S.session.user.email)||"").toLowerCase();
    try{if(localStorage.getItem("amgp_cc")==="0")var ccOff=true;}catch(e){}
    const message=mdp=>`Bonjour ${prenom}, voici le lien de l'appli de l'Amicale : ${URL_APPLI}\nIdentifiant : ${c.email}\n`+(mdp?`Mot de passe provisoire : ${mdp}\nChange-le après ta connexion (Compte › Changer mon mot de passe).`:`Ton mot de passe reste le même. Si tu l'as oublié, dis-le-moi et je t'en envoie un nouveau.`)+`\nAstuce : sur iPhone, ouvre le lien dans Safari puis Partager › Sur l'écran d'accueil pour l'avoir comme une appli.`;
    openSheet("Renvoyer le lien",`<div class="card"><p style="margin-top:0">Pour <b>${esc(p.nom)}</b> (${esc(c.email)})</p>
      <label class="check"><input type="checkbox" id="rM"> Joindre un nouveau mot de passe</label>
      <p class="note" style="margin:2px 0 10px">À cocher seulement s'il a oublié le sien : l'ancien ne fonctionnera plus.</p>
      ${moiMail?`<label class="check"><input type="checkbox" id="rCc" checked> Me mettre en copie du mail (${esc(moiMail)})</label>`:""}
      <label class="f"><span>Message</span><textarea id="rT" rows="7" readonly></textarea></label></div>
      <div class="btns"><a class="btn gold" id="rSms">Envoyer par SMS</a><a class="btn sec" id="rMail">Envoyer par mail</a></div>
      <button class="btn sec full" id="rCp">Copier le message</button>`,q=>{
      let mdp="";
      const cc=()=>{const b=$("#rCc",q);return !!(b&&b.checked&&moiMail&&moiMail!==c.email.toLowerCase());};
      const bcc=$("#rCc",q);if(bcc){if(ccOff)bcc.checked=false;bcc.onchange=()=>{try{localStorage.setItem("amgp_cc",bcc.checked?"1":"0");}catch(e){}maj();};}
      const maj=()=>{const t=message(mdp);$("#rT",q).value=t;
        $("#rSms",q).href="sms:?&body="+encodeURIComponent(t);
        $("#rMail",q).href="mailto:"+encodeURIComponent(c.email).replace(/%40/g,"@")+"?"+(cc()?"cc="+encodeURIComponent(moiMail).replace(/%40/g,"@")+"&":"")+"subject="+encodeURIComponent("Accès à l'appli de l'Amicale")+"&body="+encodeURIComponent(t);};
      $("#rM",q).onchange=async e=>{
        if(!e.target.checked){mdp="";return maj();}
        if(!await confirmBox(`Créer un nouveau mot de passe pour ${p.nom} ? L'ancien ne fonctionnera plus.`,"Créer",false)){e.target.checked=false;return;}
        const n=motDePasse();try{await appel({action:"mdp",id:c.id,motdepasse:n});mdp=n;e.target.disabled=true;toast("Nouveau mot de passe créé");}catch(err){e.target.checked=false;toast(err.message);}
        maj();};
      $("#rCp",q).onclick=()=>copy($("#rT",q).value);
      maj();
    });
  }

  VIEWS.acces={
    shell:()=>`<a class="back" href="#plus">‹ Plus</a>${intro("Le bureau","Accès à l'appli","Qui peut se connecter, et avec quel rôle.")}
      <button class="btn gold full" id="aNew">+ Nouvel accès</button><div id="aL" style="margin-top:12px"><div class="empty">Chargement…</div></div>
      <p class="note">Caissier : encaisser, créer des adhérents, signaler une erreur. Administrateur : tout.</p>`,
    bind(){$("#aNew").onclick=nouveau;charger();},
  };
  let comptes=[];
  async function charger(){
    try{comptes=(await appel({action:"liste"})).comptes;}catch(e){$("#aL").innerHTML=`<div class="banner">Impossible de lire les accès : ${esc(e.message)}</div>`;return;}
    comptes.sort((a,b)=>((a.profil&&a.profil.nom)||a.email).localeCompare((b.profil&&b.profil.nom)||b.email,"fr"));
    $("#aL").innerHTML=`<div class="list">${comptes.map(c=>{const p=c.profil,off=!p||p.actif===false;return`<div class="row" data-a="${esc(c.id)}"><div class="av">${esc(p?p.initiales:"?")}</div><div class="main"><b>${esc(p?p.nom:c.email)}${c.id===S.uid?" (vous)":""}</b><small>${esc(c.email)}${c.derniere?" · vu le "+fd(String(c.derniere).slice(0,10)):" · jamais connecté"}</small></div><div class="right">${off?'<span class="chip bad">'+(p?"Retiré":"Sans rôle")+'</span>':`<span class="chip ${p.role==="admin"?"ok":""}">${p.role==="admin"?"Admin":"Caissier"}</span>`}</div></div>`;}).join("")}</div>`;
    $$("[data-a]").forEach(r=>r.onclick=()=>fiche(comptes.find(c=>c.id===r.dataset.a)));
  }
  function fiche(c){
    const p=c.profil,off=!p||p.actif===false,moi=c.id===S.uid;
    if(!p)return toast("Compte sans rôle : créez-le depuis « Nouvel accès » avec un autre mail, ou contactez le support.");
    openSheet(p.nom,`<div class="card"><p style="margin:0">${esc(c.email)}<br>${off?"Accès retiré":(p.role==="admin"?"Administrateur":"Caissier")} · initiales ${esc(p.initiales)}</p></div>
      ${off?`<button class="btn gold full" id="fR">Rétablir l'accès</button>`:`
      ${moi?"":`<button class="btn gold full" id="fL">Renvoyer le lien de connexion</button>`}
      <div class="btns"><button class="btn" id="fM">Nouveau mot de passe</button></div>
      ${moi?"":`<label class="f"><span>Rôle</span><select id="fRole"><option value="caissier" ${p.role==="caissier"?"selected":""}>Caissier</option><option value="admin" ${p.role==="admin"?"selected":""}>Administrateur</option></select></label>
      <div class="btns"><button class="btn danger" id="fX">Retirer l'accès</button></div>`}`}`,q=>{
      const run=async(body,ok)=>{try{await appel(body);toast(ok);closeSheet();charger();reload();}catch(e){toast(e.message);}};
      const r=$("#fR",q);if(r)r.onclick=()=>run({action:"retablir",id:c.id},"Accès rétabli");
      const l=$("#fL",q);if(l)l.onclick=()=>renvoyer(c);
      const m=$("#fM",q);if(m)m.onclick=async()=>{const mdp=motDePasse();try{await appel({action:"mdp",id:c.id,motdepasse:mdp});montrerMdp("Nouveau mot de passe",c.email,mdp);}catch(e){toast(e.message);}};
      const ro=$("#fRole",q);if(ro)ro.onchange=()=>run({action:"role",id:c.id,role:ro.value},"Rôle modifié");
      const x=$("#fX",q);if(x)x.onclick=async()=>{if(await confirmBox(`Retirer l'accès de ${p.nom} ? Il ne pourra plus se connecter. Ses encaissements restent dans l'historique.`,"Retirer"))run({action:"retirer",id:c.id},"Accès retiré");};
    });
  }
  function nouveau(){
    openSheet("Nouvel accès",`<div class="card">
      <label class="f"><span>Prénom et nom <i>*</i></span><input id="nN" placeholder="Patrick Couttet" autocapitalize="words"></label>
      <div class="two"><label class="f"><span>Initiales <i>*</i></span><input id="nI" maxlength="4" autocapitalize="characters" placeholder="PC"></label>
      <label class="f"><span>Rôle</span><select id="nR"><option value="caissier">Caissier</option><option value="admin">Administrateur</option></select></label></div>
      <label class="f"><span>Adresse mail (identifiant) <i>*</i></span><input id="nE" type="email" autocapitalize="off"></label></div>
      <p class="note">Un mot de passe provisoire sera créé et affiché pour que vous le transmettiez.</p>
      <button class="btn gold full" id="nOk">Créer l'accès</button>`,q=>{
      const ini=()=>{const w=$("#nN",q).value.trim().split(/\s+/).filter(Boolean);if(!$("#nI",q).dataset.touche)$("#nI",q).value=w.length>1?(noAcc(w[0])[0]+noAcc(w[w.length-1])[0]).toUpperCase():"";};
      $("#nN",q).oninput=ini;$("#nI",q).oninput=e=>{e.target.dataset.touche=1;e.target.value=noAcc(e.target.value).toUpperCase().replace(/[^A-Z]/g,"");};
      $("#nOk",q).onclick=async()=>{
        const body={action:"creer",nom:$("#nN",q).value.trim(),initiales:$("#nI",q).value.trim(),role:$("#nR",q).value,email:$("#nE",q).value.trim().toLowerCase(),motdepasse:motDePasse()};
        if(!body.nom)return toast("Indiquez le nom");if(!/^[A-Z]{2,4}$/.test(body.initiales))return toast("Initiales : 2 à 4 lettres");if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email))return toast("Adresse mail invalide");
        $("#nOk",q).disabled=true;
        try{await appel(body);charger();reload();montrerMdp("Accès créé",body.email,body.motdepasse);}catch(e){$("#nOk",q).disabled=false;toast(e.message);}
      };
    });
  }
  if(S.view==="plus"||location.hash==="#acces")setTimeout(go,0);
})();
</script>
</body>
</html>
